  if(s.insureExp>0)h+='<div class="plRow"><span>'+TB("INS",t("insurance"))+'</span><b class="red">−'+fmt(s.insureExp)+'</b></div>';
  if(s.lcFee>0)h+='<div class="plRow"><span>'+TB("LC",t("lcFee"))+'</span><b class="red">−'+fmt(s.lcFee)+'</b></div>';
  if(s.docFee>0)h+='<div class="plRow"><span>'+t("docFix")+' ×'+s.errors+'</span><b class="red">−'+fmt(s.docFee)+'</b></div>';
  if(s.congestFee>0)h+='<div class="plRow"><span>'+TB("DEM",t("demurrage"))+'</span><b class="red">−'+fmt(s.congestFee)+'</b></div>';
  if(s.interest>0)h+='<div class="plRow"><span>'+t("interest")+'</span><b class="red">−'+fmt(s.interest)+'</b></div>';
  h+='</div><div class="coachBox"><div class="coachTitle">🧭 '+t("coach")+'</div><div class="body" id="coachTxt">'+(S.coachLoading?t("coachLoad"):esc(S.coach))+'</div></div>'
    +'<button class="cta mt12" onclick="nextTurn()">'+(S.turn>=TOTAL_TURNS?t("finish"):t("next"))+'</button></div>';
  return h;}
/* ═══ 모달: 용어사전 & 히스토리 ═══ */
function openGloss(k){const keys=k==="ALL"?Object.keys(GLOSS):[k];
  $("modalRoot").innerHTML='<div class="modalBg" onclick="closeModal(event)"><div class="modal card" onclick="event.stopPropagation()">'
    +'<div class="row spread"><h3 class="h2" style="border:none;margin:0;padding:0">📖 '+t("glossary")+'</h3>'
    +'<button class="ghost sm" onclick="closeModal()">✕ '+t("close")+'</button></div><div class="glossBody">'
    +keys.map(key=>'<div class="glossItem"><b>'+esc(L(GLOSS[key].t))+'</b><p>'+esc(L(GLOSS[key].d))+'</p></div>').join("")
    +'</div></div></div>';}
function openHistModal(){let inner;
  if(S.history.length===0)inner='<div class="hint" style="padding:20px;text-align:center">'+t("histEmpty")+'</div>';
  else{const caps=S.history.map(x=>x.capitalAfter);const mx=Math.max(...caps,1);
    inner='<div class="lbl2 mt8">'+t("capTrend")+'</div><div class="capChart">'
      +S.history.map(x=>'<div class="capBar'+(x.profit<0?" neg":"")+'" style="height:'+Math.max(8,Math.round(x.capitalAfter/mx*100))+'%" title="#'+x.turn+' '+fmt(x.capitalAfter)+'"></div>').join("")
      +'</div><div style="margin-top:10px">';
    S.history.slice().reverse().forEach(x=>{
      const evTxt=x.events.length?x.events.map(e=>({storm:"⛈",congest:"⚓",airdelay:"✈",spoil:"🦐",break:"📦",moist:"💧"}[e]||e)).join(" "):"—";
      inner+='<div class="histRow'+(S.openHist[x.turn]?" open":"")+'">'
        +'<div class="histHead" onclick="toggleHist('+x.turn+')"><span class="hn">#'+x.turn+'</span>'
        +'<span>'+(x.mode==="sea"?"🚢":"✈️")+' '+PORTS[x.from].flag+'→'+PORTS[x.to].flag+'</span>'
        +'<span class="hint">'+x.lines.length+(S.lang==="ko"?"건":" deals")+'</span>'
        +'<b class="hp '+(x.profit>=0?"green":"red")+'">'+(x.profit>=0?"+":"")+fmt(x.profit)+'</b></div>'
        +'<div class="histBody">';
      x.lines.forEach(l=>{inner+='<div class="histLine"><span>'+L(goodsById(l.g))+' '+l.qty+'CBM · '+l.incoterm+'·'+(l.pay==="LC"?"L/C":"T/T")
        +(l.lateDays>0?' <b class="red">+'+l.lateDays+(S.lang==="ko"?"일 지연":"d late")+'</b>':'')
        +(l.nonpay?' <b class="red">'+t("nonpayTag")+'</b>':'')
        +(l.dmg>0?' <b class="red">-'+Math.round(l.dmg*100)+'%</b>':'')
        +'</span><b class="green">+'+fmt(l.owed)+'</b></div>';});
      inner+='<div class="histLine"><span>'+t("histDays")+' '+x.days+(S.lang==="ko"?"일":"d")+' · '+t("histEvents")+' '+evTxt+'</span>'
        +'<span>'+t("histCap")+' <b class="cyan">'+fmt(x.capitalAfter)+'</b></span></div></div></div>';});
    inner+='</div>';}
  $("modalRoot").innerHTML='<div class="modalBg" onclick="closeModal(event)"><div class="modal card" onclick="event.stopPropagation()">'
    +'<div class="row spread"><h3 class="h2" style="border:none;margin:0;padding:0">📜 '+t("history")+' <span class="hint">'+esc(S.company.name)+'</span></h3>'
    +'<button class="ghost sm" onclick="closeModal()">✕ '+t("close")+'</button></div><div class="glossBody">'+inner+'</div></div></div>';}
function toggleHist(n){S.openHist[n]=!S.openHist[n];openHistModal();}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;$("modalRoot").innerHTML="";}
/* ═══ 게임 로직 ═══ */
function setLang(){S.lang=S.lang==="ko"?"en":"ko";renderAll();}
function startGame(){S.port=S.company.country==="KR"?"busan":"chattogram";S.market=makeMarket(S.news);S.screen="game";renderAll();placeVessel();}
function chgQty(id,d){const g=goodsById(id),maxQ=Math.floor(S.capital/S.market[id].buy);S.qty[id]=Math.max(0,Math.min(maxQ,(S.qty[id]||0)+d));renderContent();}
function setQtyMax(id,m){S.qty[id]=m;renderContent();}
function buyGoods(id){const g=goodsById(id),q=S.qty[id]||0,cost=q*S.market[id].buy;
  if(!q||cost>S.capital||S.cons.length>=MAX_CONS)return;
  S.capital-=cost;
  S.cons.push({id:UID++,goods:g,qty:q,unitCost:S.market[id].buy,buyer:newBuyerFor(id),chat:[],dealPrice:null,deadline:null,incoterm:"FOB",payMethod:null,suggest:String(S.market[id].sell)});
  S.qty[id]=0;if(!S.activeId)S.activeId=S.cons[S.cons.length-1].id;
  renderHUD();renderContent();}
function removeCon(id){const c=S.cons.find(x=>x.id===id);if(!c)return;
  S.capital+=c.unitCost*c.qty;S.cons=S.cons.filter(x=>x.id!==id);
  if(S.activeId===id)S.activeId=S.cons[0]?S.cons[0].id:null;
  renderHUD();renderContent();}
function gotoNegotiate(){S.phase="negotiate";if(S.cons[0]&&!S.activeId)S.activeId=S.cons[0].id;renderAll();}
function selectCon(id){S.activeId=id;const c=S.cons.find(x=>x.id===id);if(c&&!c.dealPrice)c.suggest=String(S.market[c.goods.id].sell);renderContent();}
function setIncoterm(ic){const a=activeCon();if(a&&!a.dealPrice){a.incoterm=ic;renderContent();}}
function walkAway(){const a=activeCon();if(!a||a.dealPrice)return;
  a.buyer=newBuyerFor(a.goods.id);a.chat=[{who:"sys",text:t("newBuyer")}];a.suggest=String(S.market[a.goods.id].sell);renderContent();}
function quickOffer(p){const inp=$("offerInp");if(inp)inp.value=p;sendOffer(p);}
async function sendOffer(pOv){const a=activeCon();if(!a||S.thinking||a.dealPrice)return;
  const inp=$("offerInp");const p=pOv!=null?pOv:parseFloat(inp?inp.value:"");if(!p)return;
  a.suggest=String(p);
  const msg=S.lang==="ko"?a.incoterm+" 조건, CBM당 "+fmt(p)+"에 "+a.qty+"CBM 어떻습니까?":fmt(p)+"/CBM for "+a.qty+" CBM, "+a.incoterm+" — deal?";
  a.chat.push({who:"me",text:msg});S.thinking=true;renderContent();
  const frPerCbm=Math.round(LCL_RATE*fx("freight"));
  let reply,accepted,counter;
  try{
    const hist=a.chat.filter(c=>c.who!=="sys").map(c=>(c.who==="me"?"S: ":"M: ")+c.text).join(" | ");
    const prompt="You are an NPC merchant in an educational trade simulation. Respond ONLY with JSON, no markdown: {\"reply\":\"...\",\"accepted\":true/false,\"counterPrice\":number}\nPersona: "+a.buyer.en+", "+a.buyer.styleEn+", credit "+a.buyer.credit+". Buying "+a.goods.en+", "+a.qty+" CBM. Market ref: $"+S.market[a.goods.id].sell+"/CBM. Hidden max: $"+a.buyer.maxPay+"/CBM on CIF; for FOB effective max is about $"+(a.buyer.maxPay-frPerCbm-8)+"/CBM.\nStudent offered $"+p+"/CBM on "+a.incoterm+". Accept if at/below max (haggle per personality); refuse with counter if above. \"reply\": 1-2 sentences in "+(S.lang==="ko"?"Korean":"English")+", in character.\nHistory: "+hist;
    const out=parseJSON(await callClaude(prompt));reply=out.reply;accepted=out.accepted;counter=out.counterPrice;
  }catch(e){
    const max=a.incoterm==="CIF"?a.buyer.maxPay:a.buyer.maxPay-frPerCbm-8;
    if(p<=max*0.97){accepted=true;reply=S.lang==="ko"?"좋습니다, 그 가격으로 하죠!":"Fine — deal!";}
    else if(p<=max){accepted=Math.random()>0.4;counter=Math.round(p*0.985);reply=accepted?(S.lang==="ko"?"빠듯하지만 좋습니다.":"Tight, but agreed."):(S.lang==="ko"?fmt(counter)+"이면 하겠습니다.":fmt(counter)+" and done.");}
    else{accepted=false;counter=Math.round(max*0.96);reply=S.lang==="ko"?"너무 높네요. "+fmt(counter)+"까지 가능합니다.":"Too high. "+fmt(counter)+" is my limit.";}
  }
  a.chat.push({who:"npc",text:reply});
  if(accepted){a.dealPrice=p;a.deadline=Math.random()<0.3?5+Math.floor(rnd(0,3)):9+Math.floor(rnd(0,6));}
  else if(counter)a.suggest=String(counter);
  S.thinking=false;renderContent();}
function setPay(id,m){const c=S.cons.find(x=>x.id===id);if(c){c.payMethod=m;renderContent();}}
function setMode(m){S.mode=m;if(m==="air")S.container=null;renderContent();}
function setContainer(c){S.container=c;renderContent();}
function togglePack(k){S.packs[k]=!S.packs[k];renderContent();}
function toggleDoc(id){S.docPick[id]=!S.docPick[id];renderContent();}
function takeLoan(){if(S.debt>=MAX_DEBT)return;S.capital+=LOAN_AMT;S.debt+=LOAN_AMT;renderHUD();renderContent();}
function departGame(){let errors=0;
  DOC_OPTIONS.forEach(d=>{const need=d.always||(d.cifOnly&&anyCif());if(need!==!!S.docPick[d.id])errors++;});
  S.capital-=errors*DOC_FEE;if(errors>0)S.rep=Math.max(0,S.rep-errors);
  let days,events=[];const rq=traitQty("reefer"),fq=traitQty("fragile"),mq=traitQty("moisture");
  if(S.mode==="sea"){days=10+Math.floor(rnd(0,4));const r1=Math.random();
    if(r1<0.15){events.push("congest");days+=2;}else if(r1<0.33)events.push("storm");
    if(rq>0&&S.container==="dry"&&Math.random()<0.75)events.push("spoil");
    if(fq>0&&!S.packs.fragile&&Math.random()<0.4)events.push("break");
    if(mq>0&&!S.packs.moisture&&Math.random()<0.4)events.push("moist");
  }else{days=2+Math.round(rnd(0,1));
    if(Math.random()<0.12){events.push("airdelay");days+=1;}
    if(fq>0&&!S.packs.fragile&&Math.random()<0.18)events.push("break");}
  S.phase="voyage";S.sailing=true;renderAll();
  const badge=$("dayBadge");badge.classList.remove("hidden");
  let d=0;const dur=4.6;
  const iv=setInterval(()=>{d++;badge.textContent="DAY "+Math.min(d,days);if(d>=days)clearInterval(iv);},dur*1000/days);
  sail3D(S.mode,dur,null);
  setTimeout(()=>{S.sailing=false;badge.classList.add("hidden");doSettle(days,events,errors);},dur*1000+400);}
function doSettle(days,events,errors){
  const fr=S.mode==="sea"?seaFreightTotal():airFreightTotal();
  const q=totalQty(),cifQ=S.cons.filter(c=>c.incoterm==="CIF").reduce((s,c)=>s+c.qty,0);
  const freightExp=S.mode==="air"?fr.cost:fr.cost*(q>0?cifQ/q:0);
  const pk=packCost(),docFee=errors*DOC_FEE,congestFee=events.includes("congest")?100:0,interest=S.debt*LOAN_INT;
  let revenue=0,goodsCost=0,lcFee=0,insureExp=0,ldTotal=0,claimTotal=0,repDelta=0;
  const lines=S.cons.map(c=>{const gross=c.dealPrice*c.qty;goodsCost+=c.unitCost*c.qty;
    if(c.payMethod==="LC")lcFee+=Math.max(40,gross*LC_RATE);
    if(c.incoterm==="CIF")insureExp+=gross*INSURE_RATE;
    let dmg=0;
    if(events.includes("spoil")&&c.goods.traits.includes("reefer"))dmg+=0.6;
    if(events.includes("break")&&c.goods.traits.includes("fragile"))dmg+=0.25;
    if(events.includes("moist")&&c.goods.traits.includes("moisture"))dmg+=0.2;
    dmg=Math.min(dmg,0.7);const claim=gross*dmg;claimTotal+=claim;if(dmg>0)repDelta-=3;
    const lateDays=Math.max(0,days-c.deadline);
    const ld=Math.min(0.21,lateDays*(c.goods.traits.includes("season")?0.05:0.03))*gross;
    ldTotal+=ld;if(lateDays>0)repDelta-=2;
    let owed=gross-claim-ld,nonpay=false;
    if(c.payMethod==="TT"){const risk=c.buyer.credit==="C"?0.3:c.buyer.credit==="B"?0.1:0.02;
      if(Math.random()<risk){nonpay=true;owed*=0.25;repDelta-=5;}}
    revenue+=owed;
    return{g:c.goods.id,qty:c.qty,incoterm:c.incoterm,pay:c.payMethod,dealPrice:c.dealPrice,deadline:c.deadline,owed,dmg,lateDays,nonpay};});
  const totalExp=freightExp+pk+insureExp+lcFee+docFee+congestFee+interest;
  const profit=revenue-goodsCost-totalExp;
  S.capital+=revenue-totalExp;
  const clean=lines.every(l=>!l.nonpay&&l.dmg===0&&l.lateDays===0)&&errors===0;
  S.rep=Math.max(0,Math.min(100,S.rep+repDelta+(clean?2:0)));
  S.settle={lines,revenue,goodsCost,freightExp,pkCost:pk,insureExp,lcFee,docFee,congestFee,interest,ldTotal,claimTotal,profit,events,days,errors,frTag:fr.tag};
  S.history.push({turn:S.turn,from:S.port,to:destPort(),mode:S.mode,days,events,profit,capitalAfter:Math.round(S.capital),lines});
  S.phase="result";renderAll();fetchCoach(S.settle);}
async function fetchCoach(s){S.coachLoading=true;S.coach="";const el0=$("coachTxt");if(el0)el0.textContent=t("coachLoad");
  let txt;
  try{
    const summary=s.lines.map(l=>goodsById(l.g).en+" "+l.qty+"CBM "+l.incoterm+"/"+l.pay+" $"+l.dealPrice+" deadline"+l.deadline+"d dmg"+Math.round(l.dmg*100)+"% late"+l.lateDays+"d nonpay:"+l.nonpay).join("; ");
    const prompt="You are a warm, substantive trade coach in an educational game. In "+(S.lang==="ko"?"Korean":"English")+", give 3-4 sentences connecting choices to real trade practice (consolidation economics, Incoterms cost/risk, L/C vs O/A, sea vs air & deadlines, packing liability). No JSON.\nShipment: "+s.lines.length+" contracts consolidated, mode "+S.mode+(S.container?"/"+S.container:"")+", transit "+s.days+"d, freight $"+Math.round(s.freightExp)+", total profit $"+Math.round(s.profit)+". Contracts: "+summary;
    txt=await callClaude(prompt);
  }catch(e){
    txt=S.lang==="ko"
      ?"순이익 "+fmt(s.profit)+". "+(s.lines.length>1?"계약 "+s.lines.length+"건을 혼재 선적해 운임을 분산했어요 — 소규모 무역상의 핵심 전략입니다. ":"다음엔 여러 계약을 묶어 운임을 나눠보세요. ")+(s.claimTotal>0?"화물 손상은 인코텀즈와 무관한 수출자 책임 — 포장·컨테이너가 곧 보험입니다. ":"")+(s.ldTotal>0?"납기 초과로 지체상금이 발생했어요. 운송 일수를 납기와 먼저 비교하세요.":"")
      :"Net "+fmt(s.profit)+". "+(s.lines.length>1?"You consolidated "+s.lines.length+" contracts to share freight — a small trader's key strategy. ":"Next time, bundle contracts to share freight. ")+(s.claimTotal>0?"Cargo damage from packing choices is the seller's liability regardless of Incoterms. ":"")+(s.ldTotal>0?"You missed a deadline — compare transit time to deadlines first.":"");
  }
  S.coach=txt;S.coachLoading=false;const el=$("coachTxt");if(el)el.textContent=txt;}
function nextTurn(){if(S.capital<=0){S.screen="bankrupt";renderAll();return;}
  if(S.turn>=TOTAL_TURNS){finishGame();return;}
  S.news=[pick(NEWS_POOL),pick(NEWS_POOL)];S.market=makeMarket(S.news);
  S.port=destPort();S.turn++;
  S.cons=[];S.activeId=null;S.qty={};S.mode=null;S.container=null;S.packs={};S.docPick={};S.settle=null;S.coach="";
  S.phase="market";renderAll();placeVessel();}
async function finishGame(){S.screen="final";renderAll();
  const entry={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),name:S.company.name,country:S.company.country,members:S.company.members.filter(Boolean),capital:Math.round(S.capital),rep:S.rep,date:new Date().toISOString().slice(0,10)};
  try{let list=[];
    try{const r=await window.storage.get("tt-leaderboard-v1",true);if(r&&r.value)list=JSON.parse(r.value);}catch(e){}
    list.push(entry);list.sort((a,b)=>b.capital-a.capital);list=list.slice(0,50);
    await window.storage.set("tt-leaderboard-v1",JSON.stringify(list),true);
    S.board={list,myId:entry.id};
  }catch(e){S.boardErr=true;S.board={list:[entry],myId:entry.id};}
  renderAll();}
function restartGame(){S={lang:S.lang,screen:"start",company:{name:"",country:"KR",members:["","",""]},capital:2000,rep:50,turn:1,debt:0,port:"busan",phase:"market",news:[pick(NEWS_POOL),pick(NEWS_POOL)],market:{},cons:[],activeId:null,qty:{},thinking:false,mode:null,container:null,packs:{},docPick:{},sailing:false,settle:null,coach:"",coachLoading:false,gloss:null,board:null,boardErr:false,history:[],mapOpen:window.innerWidth>=900,openHist:{}};
  S.market=makeMarket(S.news);renderAll();placeVessel();}
/* ═══ 초기화 ═══ */
S.market=makeMarket(S.news);
renderAll();
initThree();
</script>
